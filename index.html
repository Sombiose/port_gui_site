    <section class="sobre">
      <div class="sobre__intro">
        <div class="sobre__texto">
          <p class="rotulo mono">Sobre</p>
          <h1 class="sobre__titulo"><span>Artista multidisciplinar e desenvolvedor: desenvolvimento de hardware personalizado para criação de experiencia com público, desenho de som, trilha, coordenação audiovisual.</span></h1>
        </div>
        <!-- a foto vem da pasta /sobre (foto.jpg, foto.png...) -->
        <figure class="sobre__foto"></figure>
      </div>
      <div class="sobre__colunas">
        <div>
          <p>Formado em Imagem e Som pela UFSCar e técnico em mecatrônica, desenvolvo hardware personalizado — sensores, eletrônica embarcada e firmware — para instalações interativas, exposições e ativações de marca.</p>
          <p>No audiovisual, assino desenho de som, mixagem, trilha sonora, captação e edição de vídeo para cinema, série e podcast, além de operação de produção virtual.</p>
          <p class="sobre__contato"><a href="mailto:contato@guifiorentini.com">contato@guifiorentini.com</a></p>
        </div>
        <dl class="ficha">
          <dt>Hardware</dt><dd>ESP32, Arduino, Raspberry Pi · sensores de pulso, neurais, distância, giroscópios, piezos, encoders · LED e drivers de potência · PCB e pré-amplificadores · modelagem e impressão 3D</dd>
          <dt>Programação</dt><dd>Firmware C/C++ · Max e Pure Data · machine learning em instalação · Wi-Fi, NFC, MIDI, OSC, DMX, I²C, serial</dd>
          <dt>Som</dt><dd>Desenho de som, edição de diálogos, mixagem · som direto · espacialização 4.1 / 5.1 · sonorização generativa · trilha · Ableton, Pro Tools, Reaper</dd>
          <dt>Vídeo</dt><dd>Produção virtual e LED wall · edição · vídeo 360 · vídeo generativo · Premiere, DaVinci Resolve</dd>
          <dt>Exposição</dt><dd>Direção técnica · montagem, calibração e manutenção de obras em operação contínua · design de interação</dd>
          <dt>Formação</dt><dd>Bacharelado em Imagem e Som — UFSCar (2018) · Técnico em Mecatrônica — ETEC Getúlio Vargas (2009) · Extensão em Programação — IME-USP · NuSom e GPI — ECA-USP (2019–2021)</dd>
          <dt>Idiomas</dt><dd>Português nativo · inglês intermediário (leitura) · italiano intermediário (conversação) · espanhol básico</dd>
        </dl>
